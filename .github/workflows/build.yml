name: Build LMSApp
on: push
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to Code
        uses: actions/checkout@v7
      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name : java version
        run: java --version
      - name: clean & install
        run: mvn --update-snapshots verify clean install

